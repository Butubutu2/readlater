<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadLater — 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <main class="flex min-h-screen items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <h1 class="mb-2 text-center text-2xl font-bold">ReadLater</h1>
      <p class="mb-8 text-center text-sm text-gray-500">收藏稍后看，AI 自动分类</p>

      <form class="space-y-4">
        <div>
          <label for="email" class="sr-only">邮箱</label>
          <input
            id="email"
            type="email"
            placeholder="邮箱"
            value="user@example.com"
            class="w-full rounded-lg border border-gray-300 px-4 py-2 text-sm focus:border-gray-500 focus:outline-none"
          />
        </div>
        <div>
          <label for="password" class="sr-only">密码</label>
          <input
            id="password"
            type="password"
            placeholder="密码（至少 6 位）"
            value="········"
            class="w-full rounded-lg border border-gray-300 px-4 py-2 text-sm focus:border-gray-500 focus:outline-none"
          />
        </div>

        <button
          type="submit"
          class="w-full rounded-lg bg-gray-900 px-4 py-2 text-sm font-medium text-white hover:bg-gray-800"
        >
          登录
        </button>

        <p class="text-center text-sm text-gray-500">
          还没有账号？
          <button type="button" class="ml-1 text-gray-900 underline">注册</button>
        </p>
      </form>
    </div>
  </main>
</body>
</html>
