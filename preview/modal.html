<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadLater — 分类确认弹窗</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <!-- 遮罩 -->
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 p-4">
    <!-- 弹窗 -->
    <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-lg">
      <h3 class="mb-2 font-medium text-gray-900">OpenAI 发布 GPT-5，多模态能力大幅提升</h3>
      <p class="mb-4 text-xs text-gray-500">B 站 · 来源链接</p>

      <!-- AI 总结 -->
      <div class="rounded-lg bg-gray-50 p-3 text-sm text-gray-700">
        OpenAI 最新一代模型发布，支持图像、视频、音频的实时理解和生成
      </div>

      <!-- 标签选择 -->
      <div class="mt-3">
        <label class="block text-xs font-medium text-gray-500">标签</label>
        <input
          type="text"
          value="AI 技术"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-500 focus:outline-none"
          placeholder="输入标签名称"
        />
      </div>

      <!-- 操作按钮 -->
      <div class="mt-4 flex gap-2">
        <button class="flex-1 rounded-lg border border-gray-300 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
          取消
        </button>
        <button class="flex-1 rounded-lg bg-gray-900 px-4 py-2 text-sm font-medium text-white hover:bg-gray-800">
          保存
        </button>
      </div>
    </div>
  </div>
</body>
</html>
