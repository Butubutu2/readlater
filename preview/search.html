<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadLater — 搜索</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
  <main class="mx-auto min-h-screen max-w-lg px-4 pb-20 pt-4">
    <!-- 顶部导航 -->
    <div class="mb-6 flex items-center justify-between">
      <a href="home.html" class="text-sm text-gray-500 hover:text-gray-700">← 返回</a>
      <h1 class="text-lg font-bold text-gray-900">搜索</h1>
      <div class="w-8"></div>
    </div>

    <!-- 搜索表单 -->
    <form class="mb-4 space-y-3">
      <input
        type="text"
        placeholder="搜索标题或 AI 总结…"
        value="Transformer"
        class="w-full rounded-lg border border-gray-300 px-4 py-2 text-sm focus:border-gray-500 focus:outline-none"
      />

      <div class="flex gap-2">
        <select class="flex-1 rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-500 focus:outline-none">
          <option value="">全部标签</option>
          <option>AI 技术</option>
          <option selected>教程学习</option>
          <option>工具分享</option>
        </select>

        <select class="flex-1 rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-500 focus:outline-none">
          <option value="">全部平台</option>
          <option>微信</option>
          <option selected>B 站</option>
          <option>抖音</option>
        </select>

        <select class="flex-1 rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-gray-500 focus:outline-none">
          <option value="">全部状态</option>
          <option>未读</option>
          <option>已读</option>
        </select>
      </div>

      <button
        type="submit"
        class="w-full rounded-lg bg-gray-900 px-4 py-2 text-sm font-medium text-white hover:bg-gray-800"
      >
        搜索
      </button>
    </form>

    <!-- 搜索结果 -->
    <p class="mb-4 text-xs text-gray-400">找到 2 条结果</p>
    <div class="space-y-3">
      <a href="#" class="group relative flex gap-3 rounded-lg bg-white p-4 shadow-sm transition hover:shadow-md">
        <div class="h-16 w-16 flex-shrink-0 overflow-hidden rounded-md bg-gray-100">
          <div class="flex h-full items-center justify-center text-xs text-gray-400">封面</div>
        </div>
        <div class="min-w-0 flex-1">
          <h3 class="truncate text-sm font-medium text-gray-900 group-hover:text-gray-700">
            Transformer 详解：从 Attention 到预训练
          </h3>
          <p class="mt-1 line-clamp-2 text-xs text-gray-500">
            从原始 Transformer 论文出发，详解 Encoder-Decoder 结构和训练方法
          </p>
          <div class="mt-2 flex items-center gap-2 text-xs text-gray-400">
            <span>📺</span>
            <span>B 站</span>
            <span>· 3天前</span>
            <span class="text-gray-300">· 教程学习</span>
          </div>
        </div>
      </a>

      <a href="#" class="group relative flex gap-3 rounded-lg bg-white p-4 shadow-sm transition hover:shadow-md">
        <div class="min-w-0 flex-1 pl-0">
          <h3 class="truncate text-sm font-medium text-gray-900 group-hover:text-gray-700">
            Vision Transformer (ViT) 原理与实现
          </h3>
          <p class="mt-1 line-clamp-2 text-xs text-gray-500">
            将 Transformer 应用于图像分类，理解 Patch Embedding 和 Position Encoding
          </p>
          <div class="mt-2 flex items-center gap-2 text-xs text-gray-400">
            <span>📺</span>
            <span>B 站</span>
            <span>· 7天前</span>
            <span class="text-gray-300">· AI 技术</span>
          </div>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
